name: tests

# Runs the CPU test suite. The tests need no GPU, no data download and no network access.
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A new push to a pull request replaces the run in progress. Runs on branches always finish,
# so the status badge never shows a cancelled run.
concurrency:
  group: tests-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  tests:
    name: pytest (Python 3.11, CPU)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      # Installed first, so the next step finds torch already present and does not pull the
      # default Linux wheel with its CUDA libraries.
      - name: Install CPU-only torch
        run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Install the package with the dev extra
        run: python -m pip install -e ".[dev]"

      - name: Run the tests
        run: python -m pytest -q tests
